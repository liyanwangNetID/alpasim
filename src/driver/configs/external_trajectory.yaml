# External Trajectory Driver Configuration
#
# This driver does not load an autonomous driving neural network.
# It returns a trajectory from ExternalTrajectoryModel.

log_level: DEBUG

model:
  model_type: external_trajectory
  checkpoint_path: "unused"
  device: "cpu"

  ros_enabled: true
  ros_topic: "/alpasim/planning/ego/trajectory"
  trajectory_timeout_s: 0.5

host: "0.0.0.0"
port: 6789

inference:
  use_cameras:
    - camera_front_wide_120fov
  max_batch_size: 1
  subsample_factor: 1
  context_length: 1

route:
  default_command: 2
  use_waypoint_commands: false

output_dir: "."

trajectory_optimizer:
  enabled: false

plot_debug_images: false
